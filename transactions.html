<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transacciones - Digital Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4 text-center">Últimos Movimientos</h2>
        
        <div class="card shadow-sm p-3 mb-4">
            <label class="form-label fw-bold">Filtrar por tipo:</label>
            <select id="filtroTipo" class="form-select">
                <option value="todos">Todos los movimientos</option>
                <option value="depósito">Depósitos</option>
                <option value="transferencia enviada">Transferencias Enviadas</option>
            </select>
        </div>

        <ul id="listaTransacciones" class="list-group shadow">
            </ul>

        <div class="text-center mt-4">
            <a href="menu.html" class="btn btn-primary">Volver al Menú Principal</a>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            const movimientos = JSON.parse(localStorage.getItem('wallet_movimientos')) || [];

            function getTipoLegible(tipo) {
                const iconos = {
                    'depósito': '📥 Depósito Recibido',
                    'transferencia enviada': '📤 Transferencia Enviada'
                };
                return iconos[tipo] || tipo;
            }

            function mostrarUltimosMovimientos(filtro) {
                $('#listaTransacciones').empty();
                
                const filtrados = movimientos.filter(m => filtro === 'todos' || m.tipo === filtro);

                if (filtrados.length === 0) {
                    $('#listaTransacciones').append('<li class="list-group-item text-center text-muted">No hay movimientos para esta categoría.</li>');
                    return;
                }

                filtrados.forEach(m => {
                    const colorMonto = m.monto > 0 ? 'text-success' : 'text-danger';
                    $('#listaTransacciones').append(`
                        <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                            <div>
                                <h6 class="mb-0 fw-bold">${getTipoLegible(m.tipo)}</h6>
                                <small class="text-muted">${m.fecha} ${m.detalle ? ' - A: ' + m.detalle : ''}</small>
                            </div>
                            <span class="${colorMonto} fw-bold fs-5">
                                ${m.monto > 0 ? '+' : ''}$${Math.abs(m.monto).toLocaleString()}
                            </span>
                        </li>
                    `);
                });
            }

            $('#filtroTipo').change(function() {
                mostrarUltimosMovimientos($(this).val());
            });

            // Carga inicial
            mostrarUltimosMovimientos('todos');
        });
    </script>
</body>
</html>
