<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div id="alert-container"></div>
                <div class="card shadow border-0">
                    <div class="card-body p-4 text-center">
                        <h2 class="mb-4 fw-bold">Inicio de sesión BANCO DE AXEL</h2>
                        <form id="loginForm">
                            <div class="mb-3 text-start">
                                <label class="form-label">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="usuario@billetera.com" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label">Contraseña</label>
                                <input type="password" id="password" class="form-control" placeholder="123456" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Iniciar sesión</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Inicializar datos globales si no existen
            if (!localStorage.getItem('wallet_saldo')) localStorage.setItem('wallet_saldo', '5000');
            if (!localStorage.getItem('wallet_movimientos')) localStorage.setItem('wallet_movimientos', JSON.stringify([]));
            if (!localStorage.getItem('wallet_contactos')) localStorage.setItem('wallet_contactos', JSON.stringify([]));

            $('#loginForm').submit(function(e) {
                e.preventDefault();
                
                // Uso de selectores jQuery para obtener valores
                const email = $('#email').val();
                const pass = $('#password').val();

                // Validación ficticia
                if (email === "axel@billetera.com" && pass === "123456") {
                    $('#alert-container').html(`
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            ¡Bienvenido! Credenciales correctas.
                        </div>
                    `);
                    // Redirección con jQuery
                    setTimeout(() => {
                        window.location.href = '../menu.html';
                    }, 1000);
                } else {
                    $('#alert-container').html(`
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            Error: Email o contraseña incorrectos.
                        </div>
                    `);
                }
            });
        });
    </script>
</body>
</html>
