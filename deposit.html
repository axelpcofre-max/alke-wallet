<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Depositar - Digital Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div id="alert-container"></div>
        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h2 class="mb-4">Depositar</h2>
                <div class="alert alert-secondary">
                    Saldo actual: <strong id="currentBalance">Cargando...</strong>
                </div>
                <form id="depositForm">
                    <div class="mb-3">
                        <label class="form-label">Monto a depositar</label>
                        <input type="number" id="amount" class="form-control" placeholder="0.00" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Realizar depósito</button>
                    </button> 
                     <a href="menu.html" class="btn btn-outline-secondary w-100">
                         <i class="bi bi-arrow-left"></i> Volver al Menú Principal
                     </a>
                </form>
                <p id="depositLegend" class="mt-3 text-center text-success fw-bold d-none"></p>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Recuperamos el saldo y aseguramos que sea un número válido
            let saldoActual = parseFloat(localStorage.getItem('wallet_saldo')) || 0;
            $('#currentBalance').text('$' + saldoActual.toLocaleString());

            $('#depositForm').submit(function(e) {
                e.preventDefault();
                
                // Usamos parseFloat y || 0 para evitar errores si el campo está vacío o es 0
                const monto = parseFloat($('#amount').val()) || 0;
                const nuevoSaldo = (parseFloat(localStorage.getItem('wallet_saldo')) || 0) + monto;

                // Guardamos el nuevo saldo como string
                localStorage.setItem('wallet_saldo', nuevoSaldo.toString());

                // Para registrar en movimientos
                if (monto > 0) {
                    let movs = JSON.parse(localStorage.getItem('wallet_movimientos')) || [];
                    movs.unshift({ tipo: 'depósito', monto: monto, fecha: new Date().toLocaleString() });
                    localStorage.setItem('wallet_movimientos', JSON.stringify(movs));
                }

                // Respuesta despues de hacer la operacion de deposito
                $('#depositLegend').text('Usted ha depositado: $' + monto.toLocaleString()).removeClass('d-none');
                $('#alert-container').html('<div class="alert alert-success">¡Depósito exitoso!</div>');

                // Redirecciar al menu después de 1 segundo y medio
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1500);
            });
        });
    </script>
</body>
</html>
